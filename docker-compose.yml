version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: campusconnect-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: campusconnect_db
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: campus_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend
    restart: always
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://campus_user:campus_password@db:3306/campusconnect_db
      SECRET_KEY: super-secret-campusconnect-key-change-in-prod
      JWT_SECRET_KEY: super-jwt-secret-key-change-in-prod
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusconnect-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
